<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" role="img" aria-label="The baseline U-Net: four encoder levels of Conv, GroupNorm and ReLU with max pooling, a 1024-channel bottleneck, four decoder levels with transposed convolution and concatenation, and four skip connections carrying encoder features across to the decoder.">
<title>U-Net baseline &#8212; deep_layers</title>
<desc>A V-shaped diagram reading left to right. Each of the nine blocks is drawn as six vertical strips: Conv, GroupNorm, ReLU, twice. Channels run 64, 128, 256, 512 down the encoder, 1024 at the bottleneck, then 512, 256, 128, 64 back up the decoder. Dashed lines carry each encoder level's features to the matching decoder level, where a filled circle marks the concatenation. The output is a 1 by 1 convolution with a sigmoid.</desc>
