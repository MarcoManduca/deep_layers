    <path d="M0,0 L10,5 L0,10 z" fill="#8F877C"/>
  </marker>
  <marker id="arrowacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#9A7B1F"/>
