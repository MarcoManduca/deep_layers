name: deep-layers
channels:
  - conda-forge
dependencies:
  - python=3.11.5
  - pip
  - pip:
      - tensorflow==2.16.2
      # Pinned: the checkpoints under models/ were saved by keras 3.15 and
      # earlier versions cannot deserialize them. TF 2.16 sets no upper bound.
      - keras==3.15.1
      - tensorflow-metal==1.2.0; sys_platform == "darwin" and platform_machine == "arm64"
      - numpy==1.26.4
      - scipy==1.13.1
      - pillow==12.2.0
      - matplotlib==3.10.9
      - scikit-learn==1.8.0
      - scikit-image==0.26.0
      - tqdm==4.67.3
      - jupyter==1.1.1
      - pydantic==2.13.4
      - pydantic-settings==2.14.1
      - ruff==0.15.15
      - pytest==9.0.3
      - pytest-cov==7.1.0
